services:
  postgres:
    image: postgres:16-alpine
    container_name: aibom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aibom
      POSTGRES_PASSWORD: aibom
      POSTGRES_DB: aibom
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibom -d aibom"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      # Root context so this image can also build and bundle the SPA, which the
      # API process then serves on its own port (one container, one port).
      context: .
      dockerfile: backend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: aibom-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aibom:aibom@postgres:5432/aibom?schema=public
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
      NODE_ENV: production
      SERVE_STATIC: "true"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Optional: serve the SPA from its own container instead of from the backend.
  # Enable with: docker compose --profile standalone-frontend up
  frontend:
    profiles: ["standalone-frontend"]
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:4000
    container_name: aibom-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  postgres-data:
