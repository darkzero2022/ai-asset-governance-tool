services:
  postgres:
    image: postgres:16-alpine
    container_name: aibom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aibom
      POSTGRES_PASSWORD: aibom
      POSTGRES_DB: aibom
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: aibom-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://aibom:aibom@postgres:5432/aibom?schema=public
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:4000
    container_name: aibom-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres-data:
