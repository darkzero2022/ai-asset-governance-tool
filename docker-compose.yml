services:
  postgres:
    image: postgres:16-alpine
    container_name: aibom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aibom
      POSTGRES_PASSWORD: aibom
      POSTGRES_DB: aibom
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
