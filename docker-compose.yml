services:
  postgres:
    image: postgres:16-alpine
    container_name: aibom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aibom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — run scripts/setup.sh}
      POSTGRES_DB: ${POSTGRES_DB:-aibom}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aibom} -d ${POSTGRES_DB:-aibom}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      # Root context so this image can also build and bundle the SPA, which the
      # API process then serves on its own port (one container, one port).
      context: .
      dockerfile: backend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: aibom-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aibom}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — run scripts/setup.sh}@postgres:5432/${POSTGRES_DB:-aibom}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — run scripts/setup.sh}
      PORT: ${PORT:-4000}
      NODE_ENV: production
      SERVE_STATIC: "true"
      APP_URL: ${APP_URL:-http://localhost:${PORT:-4000}}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${PORT:-4000}}
      TRUST_PROXY: ${TRUST_PROXY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-4000}:${PORT:-4000}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:'+(process.env.PORT||4000)+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Optional: serve the SPA from its own container instead of from the backend.
  # Enable with: docker compose --profile standalone-frontend up
  frontend:
    profiles: ["standalone-frontend"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${APP_URL:-http://localhost:${PORT:-4000}}
    container_name: aibom-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173"

volumes:
  postgres-data:
