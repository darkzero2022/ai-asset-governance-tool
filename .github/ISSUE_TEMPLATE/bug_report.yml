name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. **Do not report security vulnerabilities here** —
        see [SECURITY.md](../blob/master/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Went to Risk Register → New risk
        2. Selected framework "OWASP MCP Top 10", category MCP06
        3. Expected STRIDE-AI to auto-fill; it stayed blank
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend / API
        - Frontend / UI
        - Setup / scripts
        - Framework mappings / reference data
        - Exports (CycloneDX / SPDX / CSV)
        - Auth / RBAC
        - Docs
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD`, or the release tag.
    validations:
      required: true
  - type: dropdown
    id: install-mode
    attributes:
      label: Install mode
      options: ["Docker", "Local (bundled Postgres)", "Local (external DATABASE_URL)"]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Backend logs (`logs/backend.log` or `docker compose logs backend`), browser console, the request/response envelope if it's an API error.
      render: shell
