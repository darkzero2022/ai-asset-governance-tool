name: Release

# Runs only when a version tag is pushed:
#   git tag -s v0.1.0 -m "v0.1.0" && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release + upload assets
  packages: write # push the container image to GHCR

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate CycloneDX SBOMs (self-SBOM of this tool)
        run: |
          mkdir -p sbom
          for dir in packages/shared backend frontend; do
            name="$(echo "$dir" | tr '/' '-')"
            # Full install so `npm sbom` can resolve every manifest entry; the
            # SBOM output is still scoped to the production tree.
            (cd "$dir" && npm ci --ignore-scripts)
            (cd "$dir" && npm sbom --sbom-format cyclonedx --omit=dev) > "sbom/aibom-${name}.cdx.json"
          done
          ls -la sbom

      - name: Sanity-check the generated SBOMs
        run: |
          for f in sbom/*.cdx.json; do
            fmt="$(jq -r '.bomFormat' "$f")"
            comps="$(jq '.components | length' "$f")"
            echo "$f: $fmt, $comps components"
            test "$fmt" = "CycloneDX"
            test "$comps" -gt 0
          done

      - name: Attach SBOMs to the release
        uses: softprops/action-gh-release@v2
        with:
          files: sbom/*.cdx.json
          generate_release_notes: true
          fail_on_unmatched_files: true

  image:
    runs-on: ubuntu-latest
    needs: sbom
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push (backend image — serves API + SPA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PORT=4000
          provenance: true
          sbom: true
