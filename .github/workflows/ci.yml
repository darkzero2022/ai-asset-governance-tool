name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # Throwaway credentials for the ephemeral CI Postgres (localhost only, created
  # fresh each run, never exposed).
  POSTGRES_USER: aibom
  POSTGRES_PASSWORD: ci-postgres-pw
  POSTGRES_DB: aibom
  DATABASE_URL: postgresql://aibom:ci-postgres-pw@127.0.0.1:55432/aibom?schema=public
  JWT_SECRET: ci-secret
  ADMIN_EMAIL: admin@example.com
  # >= 12 chars and not on the common-password deny-list — the reference seed
  # enforces the app's password policy on ADMIN_PASSWORD.
  ADMIN_PASSWORD: ci-throwaway-admin-pw

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint

  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Start Postgres
        run: |
          docker compose up -d postgres
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" && break
            sleep 2
          done

      - name: Build shared package
        working-directory: packages/shared
        run: npm ci && npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Prepare backend database
        working-directory: backend
        run: |
          npx prisma migrate deploy
          npm run prisma:seed

      # Catches a schema.prisma edit that never got a migration: the committed
      # migrations, replayed onto an empty shadow database, must reproduce
      # schema.prisma exactly. --exit-code is non-zero when there is a diff.
      - name: Migrations reproduce the schema (no drift)
        working-directory: backend
        run: |
          docker compose -f ../docker-compose.yml exec -T postgres createdb -U "$POSTGRES_USER" drift_shadow
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:55432/drift_shadow?schema=public" \
            --exit-code \
          && echo "no drift — migrations match schema.prisma"
          docker compose -f ../docker-compose.yml exec -T postgres dropdb -U "$POSTGRES_USER" drift_shadow

      # Cross-version: replay every migration from empty on a second database
      # (the deploy step above ran against a DB the seed then mutated). Proves the
      # ordered set still applies cleanly start to finish.
      - name: Migrations apply cleanly from empty
        run: |
          docker compose exec -T postgres createdb -U "$POSTGRES_USER" migration_check
          (cd backend && DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:55432/migration_check?schema=public" npx prisma migrate deploy)
          docker compose exec -T postgres dropdb -U "$POSTGRES_USER" migration_check

      - name: Backup / restore round-trip
        run: |
          set -e
          count() { docker compose exec -T postgres psql -U aibom -d aibom -tAc \
            "SELECT (SELECT count(*) FROM \"AIAsset\") || '/' || (SELECT count(*) FROM \"Risk\")"; }
          before="$(count)"
          echo "rows before: $before"
          scripts/backup.sh
          file="$(ls -t backups/aibom-*.sql | head -1)"
          docker compose exec -T postgres psql -U aibom -d aibom -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;" >/dev/null
          scripts/restore.sh --yes "$file"
          after="$(count)"
          echo "rows after: $after"
          test "$before" = "$after"

      - name: Test backend (with coverage threshold)
        working-directory: backend
        run: npm run test:coverage

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend (with coverage threshold)
        working-directory: frontend
        run: npm run test:coverage

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Gate: fail on a HIGH/CRITICAL advisory in the production dependency tree
      # of any workspace. Dev-only advisories are reported but do not block
      # (see the "npm audit — dev (advisory)" step below).
      - name: npm audit — production (gate)
        run: |
          status=0
          for dir in packages/shared backend frontend; do
            echo "::group::npm audit --omit=dev — $dir"
            (cd "$dir" && npm audit --omit=dev --audit-level=high) || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: npm audit — dev (advisory)
        if: always()
        run: |
          for dir in packages/shared backend frontend; do
            echo "::group::npm audit (incl. dev) — $dir"
            (cd "$dir" && npm audit || true)
            echo "::endgroup::"
          done

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aibom
          POSTGRES_PASSWORD: ci-postgres-pw
          POSTGRES_DB: aibom_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aibom -d aibom_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://aibom:ci-postgres-pw@127.0.0.1:5432/aibom_e2e?schema=public
      E2E_PORT: "4600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: packages/shared
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Golden-path E2E
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
