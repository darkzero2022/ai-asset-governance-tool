name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # Throwaway credentials for the ephemeral CI Postgres (localhost only, created
  # fresh each run, never exposed).
  POSTGRES_USER: aibom
  POSTGRES_PASSWORD: ci-postgres-pw
  POSTGRES_DB: aibom
  DATABASE_URL: postgresql://aibom:ci-postgres-pw@127.0.0.1:55432/aibom?schema=public
  JWT_SECRET: ci-secret
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: ci-admin-pw

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Start Postgres
        run: |
          docker compose up -d postgres
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" && break
            sleep 2
          done

      - name: Build shared package
        working-directory: packages/shared
        run: npm ci && npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Prepare backend database
        working-directory: backend
        run: |
          npx prisma migrate deploy
          npm run prisma:seed

      - name: Backup / restore round-trip
        run: |
          set -e
          count() { docker compose exec -T postgres psql -U aibom -d aibom -tAc \
            "SELECT (SELECT count(*) FROM \"AIAsset\") || '/' || (SELECT count(*) FROM \"Risk\")"; }
          before="$(count)"
          echo "rows before: $before"
          scripts/backup.sh
          file="$(ls -t backups/aibom-*.sql | head -1)"
          docker compose exec -T postgres psql -U aibom -d aibom -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;" >/dev/null
          scripts/restore.sh --yes "$file"
          after="$(count)"
          echo "rows after: $after"
          test "$before" = "$after"

      - name: Test backend
        working-directory: backend
        run: npm run test

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
