name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR commits
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Every commit must be signed off (Developer Certificate of Origin)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          while read -r sha; do
            subject="$(git log -1 --format=%s "$sha")"
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            # Merge commits carry no code and are exempt.
            if [ "$(git rev-list --parents -n1 "$sha" | wc -w)" -gt 2 ]; then
              continue
            fi
            if git log -1 --format=%B "$sha" | grep -qiE "^Signed-off-by: .+ <.+@.+>$"; then
              echo "ok    $sha  $subject"
            else
              echo "MISSING sign-off: $sha  $subject  ($author)"
              missing=1
            fi
          done < <(git rev-list "$BASE..$HEAD")
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Add a sign-off to each commit: git commit --amend --signoff (or git rebase --signoff $BASE)."
            echo "See CONTRIBUTING.md — by signing off you agree to the Developer Certificate of Origin (https://developercertificate.org)."
            exit 1
          fi
